[package]
name = "maestro-cli"
# Inherited so clap's `#[command(version)]` on `Cli` (defined here) prints
# the binary's version; without it `maestro --version` reported 0.0.0 (#1336).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# Core only (ADR 006, #1307): no terminal-UI crate. The `maestro` binary
# depends on both frontends and is the one place that opens the TUI.
[dependencies]
maestro-core = { path = "../maestro-core", version = "0.33.0" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
directories = "6"
futures = "0.3"
rand = { version = "0.8", features = ["small_rng"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
maestro-core = { path = "../maestro-core", version = "0.33.0", features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
