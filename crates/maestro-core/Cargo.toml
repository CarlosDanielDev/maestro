[package]
name = "maestro-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
# Exposes the `#[cfg(test)]` doubles (mock git, budget fixtures, ...) to the
# root crate's tests, which can no longer see core's `cfg(test)` items.
test-util = []
# See the root Cargo.toml: array-of-tables reorder in `Config::save_into_str`.
dynamic-config-reorder = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# `ValueEnum` derives on `adapt::prd_source::PrdSource` and `session::role::Role`.
clap = { version = "4", features = ["derive"] }
directories = "6"
flate2 = "1"
fs2 = "0.4"
futures = "0.3"
image = { version = "0.25.10", features = ["png"], default-features = false }
libc = "0.2"
minisign-verify = "0.3.0"
portable-pty = "0.9"
rand = { version = "0.8", features = ["small_rng"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "1"
syn = { version = "3", features = ["full", "visit"] }
sysinfo = "0.33"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.2"
toml_edit = "0.25"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
insta = { version = "1", features = ["filters"] }
minisign = "0.10.0"
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
