[package]
name = "maestro-tui"
# Inherited so `env!("CARGO_PKG_VERSION")` in the header and landing screen
# keeps reporting the binary's version (same reason as maestro-core).
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
maestro-core = { path = "../maestro-core", version = "0.33.1" }
anyhow = "1"
arboard = "3.6.1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = { version = "0.28", features = ["event-stream"] }
directories = "6"
futures = "0.3"
image = { version = "0.25.10", features = ["png"], default-features = false }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.29"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1", features = ["full"] }
toml = "1.2"
tracing = "0.1"
tui-textarea = { version = "0.7", features = ["crossterm"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
maestro-core = { path = "../maestro-core", version = "0.33.1", features = ["test-util"] }

insta = { version = "1", features = ["filters"] }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true
