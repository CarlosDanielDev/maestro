[package]
name = "maestro"
version = "0.33.0"
edition = "2024"
rust-version = "1.89"
description = "Multi-agent orchestrator (Claude, Codex, Qwen, OpenCode, Ollama, MiniMax) with a Matrix-style TUI"
license = "MIT"

[[bin]]
name = "maestro"
path = "src/main.rs"

# Workspace (#1304, ADR 006). maestro-core holds the core modules (#1305);
# maestro-tui holds the TUI (#1306); maestro-cli holds the headless CLI (#1307).
# There are no default-members, so plain `cargo test`/`clippy` at the root
# cover only the root package: gates pass `--workspace` to reach the crates.
[workspace]
members = ["crates/maestro-core", "crates/maestro-tui", "crates/maestro-cli"]

[workspace.package]
# maestro-core and maestro-tui inherit this so `env!("CARGO_PKG_VERSION")` in
# the updater, changelog and TUI header keeps reporting the binary's version.
# scripts/release.sh bumps it with [package].version and the core/tui deps below.
version = "0.33.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[dependencies]
maestro-core = { path = "crates/maestro-core", version = "0.33.0" }
maestro-tui = { path = "crates/maestro-tui", version = "0.33.0" }
maestro-cli = { path = "crates/maestro-cli", version = "0.33.0" }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
toml_edit = "0.25"
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.9"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
futures = "0.3"
tokio-stream = "0.1"
regex = "1"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
sha2 = "0.11"
strip-ansi-escapes = "0.2"
image = { version = "0.25.10", features = ["png"], default-features = false }
rand = { version = "0.8", features = ["small_rng"] }
sysinfo = "0.33"
syn = { version = "3", features = ["full", "visit"] }
walkdir = "2"
flate2 = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
shlex = "1"
directories = "6"
fs2 = "0.4"
minisign-verify = "0.3.0"

[features]
# Off-by-default for one release. When enabled, `Config::save_into_str` detects
# array-of-tables reorders by element-wise content hash and rewrites only the
# moved slots, preserving per-element comments. With the feature off, reorders
# fall back to a wholesale rewrite of the array (per-element comments on moved
# rows are lost; neighbors survive). See docs/configuration.md §dynamic-config.
dynamic-config-reorder = ["maestro-core/dynamic-config-reorder"]
# Empty stub for a future tmux-based interactive driver (issue #749). The
# portable-pty driver is the default; this exists so a tmux backend can land
# without a manifest change.
claude-tmux = []

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = "1"

[dev-dependencies]
maestro-core = { path = "crates/maestro-core", version = "0.33.0", features = ["test-util"] }
insta = { version = "1", features = ["filters"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
minisign = "0.10.0"

[[bench]]
name = "parser"
harness = false

[[bench]]
name = "turboquant"
harness = false

[lints]
workspace = true

[workspace.lints.rust]
# `deny` (not `forbid`) so that narrowly scoped FFI blocks can be allow-listed
# at call sites with a `// SAFETY:` comment. See docs/RUST-GUARDRAILS.md §8.
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
# Lints deliberately NOT enabled globally (documented in docs/RUST-GUARDRAILS.md §2, §11):
#   expect_used, unwrap_used, panic, todo: too many existing matches; opt-in
#     per-module via `#![deny(clippy::unwrap_used)]` in new modules until the
#     legacy is cleaned up.
#   print_stdout, print_stderr: CLI commands legitimately print to stdout/stderr.
#     Library code avoids them by convention; see guardrails §11.

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
