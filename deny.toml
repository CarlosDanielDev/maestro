# cargo-deny configuration for maestro.
# See: https://embarkstudios.github.io/cargo-deny/
#
# Philosophy: pragmatic senior-dev baseline — block real supply-chain hazards
# (known-vulnerable, wildcard versions, copyleft, non-crates.io sources)
# without blocking on every transitive-dup noise or unmaintained transitive dep
# we can't upgrade without moving upstream (ratatui, syntect, reqwest).

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
version = 2
yanked = "deny"
# Warn (not allow) so a stale ignore entry shows up once upstream fixes land.
unused-ignored-advisory = "warn"
# Single source of truth: CI's `cargo audit` job reads its --ignore list from
# the quoted IDs in this array (.github/workflows/ci.yml). Keep one ID per line.
ignore = [
    # Transitive via `syntect` — bincode 1.x is considered complete by the
    # bincode maintainers and has no known vulnerability. Upstream syntect
    # hasn't moved to bincode 2.x / alternatives yet.
    # RUSTSEC-2025-0141: https://rustsec.org/advisories/RUSTSEC-2025-0141
    "RUSTSEC-2025-0141",
    # Transitive via `syntect` — yaml-rust maintainer unreachable but no
    # known vulnerability. syntect hasn't migrated to yaml-rust2 yet.
    # RUSTSEC-2024-0320: https://rustsec.org/advisories/RUSTSEC-2024-0320
    "RUSTSEC-2024-0320",
    # Direct dependency of maestro, maestro-cli, maestro-core and maestro-tui —
    # chrono is flagged unmaintained, with no known vulnerability and no
    # patched version. Moving to `jiff` or `time` is tracked as a follow-up.
    # RUSTSEC-2026-0543: https://rustsec.org/advisories/RUSTSEC-2026-0543
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
    # portable-pty (interactive claude transport, #749) pins bitflags 1.x;
    # the rest of the workspace ecosystem is on 2.x.
    { name = "bitflags", version = "1", reason = "portable-pty pins v1; workspace uses v2 — upstream tracking: portable-pty/wezterm" },
    # getrandom: rand (0.8) uses 0.2.17; uuid uses 0.4.2.
    { name = "getrandom", version = "0.2", reason = "rand 0.8 pins v0.2.17; newer uuid uses v0.4 — no upgrade path" },
    # thiserror: redox_users (via directories) pins 1.x; maestro/syntect use 2.x.
    { name = "thiserror", version = "1", reason = "redox_users via directories pins v1; workspace and syntect use v2 — no upgrade path without replacing directories/redox_users" },
    { name = "thiserror-impl", version = "1", reason = "proc-macro pair for thiserror v1 pulled by redox_users via directories" },
    # syn: under --all-features CI resolves two syn 2.x versions (transitive via
    # thiserror v1/v2 impls) alongside the insight design_system extractor's
    # direct dep (#1011). Name-only skip covers all versions — resilient to
    # Cargo.lock churn, matching the windows-sys entry below.
    { name = "syn", reason = "multiple syn 2.x versions across the thiserror-impl v1/v2 + insight design_system (#1011) dep graph under --all-features — no single-version pin possible" },
    # windows-sys: multiple versions across the Windows crate ecosystem.
    # Name-only skip covers all versions — resilient to Cargo.lock churn
    # (seen v0.52, v0.59, v0.60, v0.61 depending on resolution target).
    { name = "windows-sys", reason = "multiple versions across windows ecosystem (ring/rustix/clap/tokio/arboard pin different majors); no single upgrade path" },
    # base64: reqwest 0.12 pins 0.22; hyper-util and plist (via syntect) use 0.23.
    # Name-only skip is robust to lockfile drift between macOS and Linux CI.
    { name = "base64", reason = "reqwest 0.12 uses v0.22; hyper-util/plist use v0.23 — no upgrade path without a reqwest major bump" },
    # rand_core: maestro's direct rand 0.8 pins 0.6; the proptest/tempfile dev
    # chain uses 0.10. Dedupe requires the rand 0.8 → 0.9+ migration (API
    # renames across the crate) — real work, tracked separately from CI repair.
    { name = "rand_core", reason = "rand 0.8 pins v0.6; proptest (dev) chain uses v0.10 — dedupe needs the rand 0.9+ migration, out of scope for gate repair" },
    # miniz_oxide: png 0.18 uses 0.8; flate2 1.1 (maestro/syntect/tiff) uses 0.9.
    { name = "miniz_oxide", reason = "png 0.18 uses v0.8; flate2 1.1 uses v0.9 — no upgrade path without a png bump" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
