name: Nightly Freshness

# Runs on a weekly schedule (Mondays 04:00 UTC) and on manual dispatch.
# Verifies the most recent scheduled `nightly.yml` workflow run on main
# succeeded within the last 3 days. Originally a per-PR gate; moved to
# a weekly cadence because every PR was paying the cost of a check that
# describes the health of `nightly.yml`, not the PR itself.

# Least privilege by default (#1040): jobs that need more than read access
# must opt in with a job-level permissions block. The freshness composite
# lists workflow runs via the Actions API, which needs actions: read —
# without it the scheduled run 403s (PR CI never exercises that path).
permissions:
  contents: read
  actions: read

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  freshness:
    name: nightly-freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.github/actions/freshness
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          max_age_days: '3'
          workflow_file: 'nightly.yml'
