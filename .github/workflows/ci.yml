name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege by default (#1040): jobs that need more than read access
# must opt in with a job-level permissions block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - run: cargo test --verbose --locked
      # Snapshot enforcement: fails if any insta snapshot has an unreviewed diff.
      # Run `cargo insta review` locally to approve snapshot changes before pushing.
      - name: Check snapshots
        env:
          INSTA_UPDATE: "no"
        run: cargo test --verbose --locked 2>&1 | (! grep -q "pending snapshots")
      # Lockfile currency (#1039): a --locked build must leave the committed
      # Cargo.lock untouched. Any diff means the lockfile went stale relative
      # to the manifests, and CI would have audited/built a graph the repo
      # never resolved.
      - name: Check Cargo.lock is current
        run: git diff --exit-code Cargo.lock

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - run: cargo clippy --locked -- -D warnings -A dead_code

  sync-templates:
    # Drift gate for canonical command templates (#706).
    # Fails the build when rendered command files drift from what
    # `maestro sync-templates` would emit from `.maestro/templates/`.
    name: Templates Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Check rendered templates are in sync
        run: cargo run --quiet -- sync-templates --check

  docs-gen:
    name: Docs Autogen Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Check docs/configuration.md is in sync
        run: cargo test --quiet --locked docs_gen_no_drift --bin maestro

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  file-size:
    name: File Size Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-file-size.sh

  # Verifies every provider entry point (.claude/CLAUDE.md, .codex/AGENTS.md,
  # AGENTS.md, GEMINI.md) embeds the canonical Golden Rules block from
  # .maestro/templates/core/golden-rules.md. No untrusted input.
  rules-drift:
    name: Golden Rules Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check-rules-drift.sh

  deny:
    # Supply-chain gate: advisories, wildcards, licenses, registries.
    # Ignore list for transitive-only unmaintained advisories is documented
    # in deny.toml with RUSTSEC links. See docs/RUST-GUARDRAILS.md section 9.
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories bans licenses sources

  audit:
    # Advisory scan against the RustSec database. Ignores the same transitive
    # unmaintained advisories as deny.toml — we can't upgrade without upstream
    # ratatui / syntect / reqwest moving first.
    #
    # Cargo.lock is committed (#1039): cargo-audit scans the same resolved
    # graph that ships in release binaries, not one resolved fresh on the
    # runner.
    #
    # RUSTSEC-2026-0002 (lru "unsound") is gated by ratatui 0.29 → 0.30 bump;
    # see deny.toml for the per-advisory rationale.
    name: Cargo Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.23.0
      - name: Run cargo audit
        run: |
          set -euo pipefail

          audit_args=(
            --ignore RUSTSEC-2025-0141
            --ignore RUSTSEC-2024-0436
            --ignore RUSTSEC-2024-0320
            --ignore RUSTSEC-2026-0097
            --ignore RUSTSEC-2026-0098
            --ignore RUSTSEC-2026-0099
            --ignore RUSTSEC-2026-0104
            --ignore RUSTSEC-2026-0002
            --file ./Cargo.lock
          )

          for attempt in 1 2 3; do
            if cargo audit "${audit_args[@]}"; then
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            sleep "$((attempt * 20))"
          done

  coverage:
    # Wave 2.1 — report mode during baseline phase.
    # The script exits 0 by default (report mode) — it prints tier
    # percentages and VIOLATION lines for visibility but keeps the CI
    # check green. Activation is adding `--enforce` to the final script
    # invocation below, which flips the script to strict-exit mode.
    # Activate once baseline reaches the floor for a tier; each tier
    # activation is a dedicated PR.
    name: Coverage Tiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Install yq (Mike Farah Go-based, not Python apt package)
        # Ubuntu's apt `yq` is the Python jq-wrapper, which has a different
        # CLI from the Go-based Mike Farah yq used by check-coverage-tiers.sh.
        # Composite action pins the version and sha256-verifies the binary.
        uses: ./.github/actions/setup-yq
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked --version 0.9.1
      - name: Generate lcov
        run: cargo llvm-cov --workspace --lcov --output-path coverage.lcov
      - name: Check coverage tiers
        run: bash scripts/check-coverage-tiers.sh coverage.lcov

  duplication:
    # Wave stats — report mode during baseline phase.
    # The job always exits 0 (cargo dupes stats never fails). It prints the
    # full JSON duplication report for visibility and trend tracking.
    # Activation path: once baseline is stable, replace 'stats' with
    #   cargo dupes check --max-exact-percent <X> --max-near-percent <Y>
    # and remove this comment block. Each threshold activation is a dedicated PR.
    name: Code Duplication
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@aa7c1c80a07a27a84c0aa76d0cef0aad3830e330 # v2.7.8
      - name: Install cargo-dupes
        run: cargo install cargo-dupes --locked --version 0.2.1
      - name: Duplication report (baseline metrics)
        run: cargo dupes stats --format json

  layers:
    # Wave 2.3 — layer violation enforcement.
    # Blocking by default (no continue-on-error). Existing violations
    # are tolerated via docs/layers-debt.txt until their deadlines;
    # the script fails on new violations or past-deadline debt.
    name: Architecture Layers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yq (Mike Farah Go-based, not Python apt package)
        # Same pinned + checksum-verified binary as the coverage job above —
        # one composite action so the two copies cannot drift.
        uses: ./.github/actions/setup-yq
      - name: Check architecture layers
        run: bash scripts/check-layers.sh

  actionlint:
    # Static analysis on every workflow YAML in .github/workflows/.
    # Replaces the per-issue scripts/verify-issue-NNN.sh files (#485, #507) with
    # a single generic gate. Strict severity (default) so we keep catching
    # shellcheck `info` findings like the SC2035 from #507.
    name: Actionlint
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Lint job needs no GitHub API access; don't leave the token in
          # .git/config for the runner's lifetime. Defense in depth.
          persist-credentials: false

      - name: Install actionlint (pinned binary + sha256 verify)
        id: actionlint
        shell: bash
        # Direct download + sha256 verify. We do NOT fetch the bootstrap script
        # at runtime: v1.7.12 is a lightweight tag (mutable by anyone with push
        # access), so URL tag-pinning ≠ SHA-pinning. Bump VERSION + EXPECTED_SHA256
        # together.
        run: |
          set -euo pipefail
          VERSION="1.7.12"
          ARCHIVE="actionlint_${VERSION}_linux_amd64.tar.gz"
          EXPECTED_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl --fail --silent --show-error --location \
               --output "${ARCHIVE}" \
               "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/${ARCHIVE}"
          echo "${EXPECTED_SHA256}  ${ARCHIVE}" | sha256sum --check --status
          mkdir -p "${RUNNER_TEMP}/actionlint"
          tar -xzf "${ARCHIVE}" -C "${RUNNER_TEMP}/actionlint" actionlint
          rm "${ARCHIVE}"
          echo "executable=${RUNNER_TEMP}/actionlint/actionlint" >> "$GITHUB_OUTPUT"

      - name: Lint workflows
        shell: bash
        # Strict: default severity (surfaces shellcheck `info` findings).
        run: ${{ steps.actionlint.outputs.executable }} -color

      - name: Assert no secrets interpolated outside env/with keys
        shell: bash
        # Cross-cutting structural invariant. Every ${{ secrets.* }} reference
        # MUST appear on a line where the entire value after the colon is exactly
        # the secrets expression (env: / with: key assignments). Anything else —
        # interpolation in a run: shell, an if: condition, etc. — is CWE-78
        # (shell injection) and was the core mitigation for #507.
        # Note: GitHub interpolates secrets-context expressions everywhere they
        # appear in workflow YAML before the runner sees them; this grep is
        # therefore an exhaustive structural check, not a heuristic.
        run: |
          set -euo pipefail
          violations=$(
            grep -rn -E '\$\{\{[[:space:]]*secrets\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\}\}' \
              .github/workflows/ \
              | grep -vE '^[^:]+:[0-9]+:[[:space:]]+[A-Za-z_][A-Za-z0-9_-]*:[[:space:]]+\$\{\{[[:space:]]*secrets\.[A-Za-z_][A-Za-z0-9_]*[[:space:]]*\}\}[[:space:]]*$' \
              || true
          )
          if [ -n "${violations}" ]; then
            echo "::error::secrets.* interpolation outside env/with key (CWE-78):"
            printf '%s\n' "${violations}"
            exit 1
          fi
          echo "ok: no secrets.* interpolated outside env/with keys"

      - name: "Assert uses: refs are SHA-pinned and workflows declare permissions"
        shell: bash
        # Supply-chain structural invariant (#1040). A remote `uses:` ref is
        # only trustworthy when it resolves to an immutable commit: tags and
        # branches are mutable by anyone with push access, so tag-pinning is
        # not SHA-pinning (same reasoning as the actionlint install step
        # above). Local composite actions (./.github/actions/*) are exempt —
        # they are versioned with the repo itself. Every workflow must also
        # declare a top-level `permissions:` so jobs start from least
        # privilege instead of the token's broad default, and no tool may be
        # fetched from a moving releases/latest/ URL.
        run: |
          set -euo pipefail
          mutable_uses=$(
            grep -rnE '^[[:space:]]*(-[[:space:]]+)?uses:' .github/workflows/ \
              | grep -vE 'uses:[[:space:]]*\./' \
              | grep -vE '@[0-9a-f]{40}([[:space:]]+|$)' \
              || true
          )
          unpinned_downloads=$(grep -rnE '(wget|curl)[^|]*releases/latest/download' .github/ || true)
          missing_permissions=""
          for f in .github/workflows/*.yml; do
            grep -q '^permissions:' "${f}" || missing_permissions="${missing_permissions}${f}"$'\n'
          done
          if [ -n "${mutable_uses}${unpinned_downloads}${missing_permissions}" ]; then
            echo "::error::supply-chain gate failed (CWE-829 / CWE-494 / CWE-250):"
            if [ -n "${mutable_uses}" ]; then
              echo "uses: refs not pinned to a 40-hex commit SHA:"
              printf '%s\n' "${mutable_uses}"
            fi
            if [ -n "${unpinned_downloads}" ]; then
              echo "downloads from a moving releases/latest/ URL:"
              printf '%s\n' "${unpinned_downloads}"
            fi
            if [ -n "${missing_permissions}" ]; then
              echo "workflows missing a top-level permissions: block:"
              printf '%s' "${missing_permissions}"
            fi
            exit 1
          fi
          echo "ok: every remote uses: is SHA-pinned; no latest-release downloads; top-level permissions present"
