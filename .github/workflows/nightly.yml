name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege by default (#1040): jobs that need more than read access
# must opt in with a job-level permissions block.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # `taiki-e/install-action` fetches the prebuilt cargo-mutants binary
      # from its GitHub release and caches it across runs, replacing the
      # previous `cargo install cargo-mutants --locked` step that re-built
      # the binary on every nightly (~5–10 min/shard).
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-mutants
      # --baseline=skip is mandatory when sharding.
      # The baseline-green assumption is enforced by the regular `test`
      # job in ci.yml (per-PR, blocking); mutation only runs nightly
      # after main's test suite is known-green.
      #
      # Shard count was raised from 4 to 8 so each shard handles half the
      # mutation surface and lands well inside the 180-minute job budget.
      # The matrix length above and the `--shard X/N` arg below must match.
      - name: Run mutation tests (shard ${{ matrix.shard }}/8)
        run: cargo mutants --shard ${{ matrix.shard }}/8 --no-shuffle --baseline=skip
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: miri, rust-src
      - uses: Swatinem/rust-cache@9d47c6ad4b02e050fd481d890b2ea34778fd09d6 # v2.7.8
      # Tests that spawn subprocesses or hit FFI need
      # #[cfg_attr(miri, ignore)] annotations — add them as miri
      # surfaces failures during warmup.
      - name: Run miri on parser + integration tests
        run: cargo miri test --package maestro --test '*' 2>&1 | tee miri.log
      - name: Upload miri log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: miri-log
          path: miri.log
