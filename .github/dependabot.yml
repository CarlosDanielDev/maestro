# Dependabot keeps the committed Cargo.lock current (#1039): weekly cargo
# update PRs, gated by CI's --locked checks so a refreshed lockfile must
# still describe a buildable graph.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  # Keep the SHA pins in .github/workflows/ current (#1040): Dependabot
  # resolves the version comment to the latest tag and updates both the
  # commit SHA and the comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
